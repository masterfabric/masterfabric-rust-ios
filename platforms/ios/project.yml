name: MasterFabricRust
options:
  bundleIdPrefix: co.masterfabric
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  MasterFabricRust:
    type: application
    platform: iOS
    sources:
      - path: MasterFabricRust
        excludes:
          - "**/.gitkeep"
    dependencies:
      - framework: Frameworks/AppCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.masterfabric.rustios
        PRODUCT_NAME: MasterFabricRust
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "MasterFabric Rust"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  MasterFabricRust:
    build:
      targets:
        MasterFabricRust: all
    run:
      config: Debug
    archive:
      config: Release
