# Tune code generation for Apple silicon.
# - Simulator on Apple-silicon Macs: M1 is the lowest Apple-silicon Mac CPU.
# - Devices: A14 (iPhone 12) baseline. Raise this if you drop older devices,
#   or set it to "apple-a7"-level generic if you must support very old iPhones.
[target.aarch64-apple-ios-sim]
rustflags = ["-C", "target-cpu=apple-m1"]

[target.aarch64-apple-ios]
rustflags = ["-C", "target-cpu=apple-a14"]
