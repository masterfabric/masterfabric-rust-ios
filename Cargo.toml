[workspace]
resolver = "2"
members = ["crates/app-core", "crates/app-ffi", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
uniffi = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
# UniFFI catches panics with catch_unwind and turns them into errors; with "abort" a
# Rust panic terminates the app instead. The core has no expected panics, so we trade
# that for smaller/faster code (no unwind tables / landing pads).
panic = "abort"
strip = true
